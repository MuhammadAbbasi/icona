<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A365D"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Building/arch mark matching the logo icon, in white and sky cyan -->
  <!-- Top center pillar -->
  <rect x="28" y="8" width="8" height="18" rx="3" fill="#ffffff"/>
  <!-- Left arm -->
  <polygon points="32,26 10,50 16,56 32,34" fill="#38BDF8"/>
  <!-- Right arm -->
  <polygon points="32,26 54,50 48,56 32,34" fill="#ffffff" opacity="0.9"/>
  <!-- Left leg base -->
  <rect x="8" y="48" width="18" height="8" rx="3" fill="#38BDF8"/>
  <!-- Right leg base -->
  <rect x="38" y="48" width="18" height="8" rx="3" fill="#ffffff"/>
</svg>
