<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ICONA — construction ERP, monitored</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A365D"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- faint blueprint grid -->
  <path d="M128 0V512 M256 0V512 M384 0V512 M0 128H512 M0 256H512 M0 384H512"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- steel I-beam (the letter I) -->
  <g fill="#ffffff">
    <rect x="136" y="112" width="240" height="58" rx="14"/>
    <rect x="221" y="150" width="70" height="212"/>
    <rect x="136" y="342" width="240" height="58" rx="14"/>
  </g>

  <!-- monitoring pulse through the beam -->
  <path d="M104 256 H208 l20 -38 28 76 20 -38 H408"
        fill="none" stroke="#38BDF8" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
